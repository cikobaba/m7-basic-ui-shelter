<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelter — Add Animal</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    nav { background: #f1f5f9; padding: 0.6rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #2563eb; }
    nav a:hover { text-decoration: underline; }
    h1 { border-bottom: 2px solid #333; padding-bottom: 0.4rem; }
    form { display: grid; gap: 0.5rem; max-width: 480px; margin-top: 1rem; }
    label { font-weight: bold; }
    input, select, textarea { padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    button { padding: 0.6rem 1.2rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; width: fit-content; }
    button:hover { background: #1d4ed8; }
    .back-link { display: inline-block; margin-top: 1rem; color: #2563eb; }
  </style>
</head>
<body>

  <!-- Navigation — same on every page -->
  <nav>
    <a href="/static">Home</a>
    <a href="/animals">All animals</a>
    <a href="/animals/new">Add animal</a>
  </nav>

  <main>
    <h1>Add a new animal</h1>

    <!--
      TODO: replace action="/animals" with th:action="@{/animals}"
            add th:object="${form}" to <form>
            replace name="..." on each input with th:field="*{fieldName}"
    -->

    <form th:action="@{/animals}"
          th:object="${form}"
          method="post">

      <label for="name">Animal name</label>
      <input id="name"
             th:field="*{name}"
             type="text"
             required
             placeholder="e.g. Milo">

      <label for="type">Animal type</label>
      <select id="type"
              th:field="*{type}"
              required>
        <option value="">Choose animal type</option>
        <option value="CAT">Cat</option>
        <option value="DOG">Dog</option>
        <option value="OTHER">Other</option>
      </select>

      <label for="breed">Breed</label>
      <input id="breed"
             th:field="*{breed}"
             type="text"
             placeholder="e.g. Siamese">

      <label for="age">Age (years)</label>
      <input id="age"
             th:field="*{age}"
             type="number"
             min="0"
             placeholder="e.g. 3">

      <label for="description">Description</label>
      <textarea id="description"
                th:field="*{description}"
                rows="3"
                placeholder="Describe the animal"></textarea>

      <label for="imageUrl">Image filename or URL</label>
      <input id="imageUrl"
             th:field="*{imageUrl}"
             type="text"
             placeholder="e.g. Luna.jpeg">

      <button type="submit">Add animal</button>

    </form>

    <a href="/animals" class="back-link">← Back to list</a>
  </main>

</body>
</html>
